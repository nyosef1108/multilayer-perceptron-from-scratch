<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MLP from scratch</title>
  <desc id="d">Three-layer neural network mark with one highlighted forward path, next to the wordmark.</desc>
  <style>
    :root { --ink:#14181F; --soft:#6B7480; --line:#14181F; --accent:#3B5BFF; --frame:#C4CAD2; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#F2F4F8; --soft:#98A1AE; --line:#F2F4F8; --accent:#7C93FF; --frame:#4A515B; }
    }
    .frame { fill:none; stroke:var(--frame); stroke-width:2; }
    .edge { stroke:var(--line); stroke-width:1.5; opacity:.18; fill:none; }
    .path { stroke:var(--accent); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .node { fill:none; stroke:var(--ink); stroke-width:2.5; }
    .hot  { fill:var(--accent); stroke:var(--accent); stroke-width:2.5; }
    .title { font:600 36px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--ink); letter-spacing:-0.5px; }
    .sub   { font:400 20px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--soft); letter-spacing:6px; }
  </style>

  <rect class="frame" x="1" y="1" width="718" height="218" rx="24" ry="24"/>

  <g transform="translate(30 20)">
  <!-- connections: layer 1 (x=26) -> layer 2 (x=90) -->
  <g class="edge">
    <path d="M26 62 L90 36"/><path d="M26 62 L90 90"/><path d="M26 62 L90 144"/>
    <path d="M26 118 L90 36"/><path d="M26 118 L90 90"/><path d="M26 118 L90 144"/>
    <!-- layer 2 (x=90) -> layer 3 (x=154) -->
    <path d="M90 36 L154 62"/><path d="M90 36 L154 118"/>
    <path d="M90 90 L154 62"/><path d="M90 90 L154 118"/>
    <path d="M90 144 L154 62"/><path d="M90 144 L154 118"/>
  </g>

  <!-- highlighted forward pass -->
  <path class="path" d="M26 62 L90 90 L154 118"/>

  <!-- nodes -->
  <circle class="hot"  cx="26"  cy="62"  r="8"/>
  <circle class="node" cx="26"  cy="118" r="8"/>

  <circle class="node" cx="90"  cy="36"  r="8"/>
  <circle class="hot"  cx="90"  cy="90"  r="8"/>
  <circle class="node" cx="90"  cy="144" r="8"/>

  <circle class="node" cx="154" cy="62"  r="8"/>
  <circle class="hot"  cx="154" cy="118" r="8"/>

  <!-- wordmark -->
  <text class="title" x="206" y="86">multilayer perceptron</text>
  <text class="sub"   x="207" y="122">FROM SCRATCH</text>
  </g>
</svg>
